services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusskill}
      POSTGRES_USER: ${POSTGRES_USER:-campusskill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusskill}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusskill} -d ${POSTGRES_DB:-campusskill}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Наружу отдаём 5434: 5432 и 5433 на этой машине уже заняты другими проектами.
    # Контейнер web обращается к базе внутри сети compose по хосту db:5432.
    ports:
      - "127.0.0.1:5434:5432"

  web:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  staticfiles:
